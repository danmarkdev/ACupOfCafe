<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cup of Cafe</title>
<style>
  :root{
    --bg: #FBF6EE;
    --ink: #2B2018;
    --sub: #6B5D4E;
    --line: #E4D9C6;
    --panel: #FFFFFF;
    --brass: #A9723B;
    --brass-dark: #8A5A2B;
    --green: #4C6B4A;
    --danger: #B4453A;
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:28px 5vw 18px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:1.9rem;
    margin:0;
    letter-spacing:0.5px;
    font-weight:600;
  }
  header p{
    margin:4px 0 0;
    color:var(--sub);
    font-size:0.95rem;
  }
  .cart-toggle{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--ink);
    color:var(--bg);
    border:none;
    padding:10px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:0.9rem;
    align-self:center;
  }
  .cart-toggle:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--brass-dark);
    outline-offset:2px;
  }

  main{
    display:grid;
    grid-template-columns: 1fr 340px;
    gap:0;
    max-width:1200px;
    margin:0 auto;
  }
  .menu{ padding: 10px 5vw 60px 5vw; }
  .category{ margin-top:34px; }
  .category h2{
    font-size:1.05rem;
    text-transform:none;
    font-family:'Helvetica Neue', Arial, sans-serif;
    letter-spacing:0.3px;
    color:var(--brass-dark);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:4px;
  }
  .item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:16px 0;
    border-bottom:1px dashed var(--line);
  }
  .item-image{
    flex-shrink:0;
    width:58px;
    height:58px;
  }
  .item-image svg{ width:100%; height:100%; display:block; }
  .item-main{
    display:flex;
    gap:14px;
    align-items:flex-start;
    flex:1;
  }
  .item-info h3{ margin:0 0 4px; font-size:1.08rem; font-weight:600;}
  .item-info p{ margin:0; color:var(--sub); font-size:0.88rem; max-width:46ch;}
  .item-price{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    white-space:nowrap;
    margin-top:2px;
  }
  .item-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
    min-width:96px;
  }
  .add-btn{
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:transparent;
    border:1px solid var(--brass);
    color:var(--brass-dark);
    padding:6px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:0.85rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .add-btn:hover{ background:var(--brass); color:#fff; }
  .qty-controls{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .qty-controls button{
    width:26px; height:26px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:50%;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
  }

  /* Cart panel */
  aside.cart{
    background:var(--panel);
    border-left:1px solid var(--line);
    padding:26px 24px 40px;
    position:sticky;
    top:0;
    align-self:start;
    height:100vh;
    overflow-y:auto;
  }
  aside.cart h2{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:1rem;
    margin:0 0 18px;
    color:var(--sub);
  }
  .cart-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .cart-line .name{ font-weight:600; }
  .cart-line .meta{ color:var(--sub); font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.8rem; }
  .remove-link{
    background:none;border:none;color:var(--danger);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.78rem; cursor:pointer; padding:0; text-decoration:underline;
  }
  .empty-note{ color:var(--sub); font-size:0.9rem; margin-top:20px; }
  .totals{
    margin-top:18px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.92rem;
  }
  .totals-row{ display:flex; justify-content:space-between; padding:5px 0; }
  .totals-row.grand{ font-weight:700; font-size:1.1rem; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }

  fieldset{ border:none; padding:0; margin:20px 0 0; }
  label{ display:block; font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.82rem; color:var(--sub); margin:12px 0 4px; }
  input[type=text], input[type=tel], textarea, select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.92rem;
    background:#FEFDFB;
  }
  textarea{ resize:vertical; min-height:56px; }
  .radio-group{ display:flex; gap:14px; font-family:'Helvetica Neue', Arial, sans-serif; font-size:0.88rem; }
  .radio-group label{ display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); }

  .place-order{
    width:100%;
    margin-top:20px;
    padding:13px;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.95rem;
    cursor:pointer;
  }
  .place-order:disabled{ background:#B9C4B8; cursor:not-allowed; }
  .error{ color:var(--danger); font-size:0.8rem; margin-top:6px; font-family:'Helvetica Neue', Arial, sans-serif;}

  .confirmation{
    text-align:center;
    padding:30px 10px;
  }
  .confirmation .stamp{
    font-size:2rem;
    margin-bottom:6px;
  }
  .confirmation h3{ margin:0 0 6px; }
  .confirmation p{ color:var(--sub); font-size:0.9rem; margin:4px 0; }
  .new-order-btn{
    margin-top:18px;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:9px 18px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; }
    aside.cart{
      position:fixed;
      top:0; right:0;
      width:min(90vw, 380px);
      height:100vh;
      transform:translateX(100%);
      transition:transform 0.25s ease;
      box-shadow:-6px 0 24px rgba(0,0,0,0.15);
      z-index:20;
    }
    aside.cart.open{ transform:translateX(0); }
    .cart-toggle{ display:inline-block; }
    .backdrop{
      display:none;
      position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:15;
    }
    .backdrop.show{ display:block; }
  }
  @media (min-width: 861px){
    .cart-toggle{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Cup of Cafe</h1>
    <p>Order ahead for pickup — ready in ~15 minutes</p>
  </div>
  <button class="cart-toggle" id="cartToggleBtn">Cart (<span id="toggleCount">0</span>)</button>
</header>

<main>
  <section class="menu" id="menu"></section>

  <div class="backdrop" id="backdrop"></div>
  <aside class="cart" id="cartPanel">
    <h2>Your order</h2>
    <div id="cartLines"></div>
    <div id="emptyNote" class="empty-note">Your cart is empty. Add something from the menu to get started.</div>

    <div class="totals" id="totalsBlock" style="display:none;">
      <div class="totals-row"><span>Subtotal</span><span id="subtotalVal">$0.00</span></div>
      <div class="totals-row"><span>Tax (8%)</span><span id="taxVal">$0.00</span></div>
      <div class="totals-row grand"><span>Total</span><span id="totalVal">$0.00</span></div>
    </div>

    <form id="orderForm" style="display:none;">
      <fieldset>
        <label for="custName">Name for order</label>
        <input type="text" id="custName" required>

        <label for="custPhone">Phone number</label>
        <input type="tel" id="custPhone" required placeholder="For pickup text alert">

        <label>Order type</label>
        <div class="radio-group">
          <label><input type="radio" name="orderType" value="Pickup" checked> Pickup</label>
          <label><input type="radio" name="orderType" value="Dine-in"> Dine-in</label>
        </div>

        <label for="notes">Notes (optional)</label>
        <textarea id="notes" placeholder="Oat milk, extra hot, allergies, etc."></textarea>
      </fieldset>
      <div id="formError" class="error" style="display:none;"></div>
      <button type="submit" class="place-order" id="placeOrderBtn">Place order</button>
    </form>

    <div class="confirmation" id="confirmation" style="display:none;">
      <div class="stamp">☕</div>
      <h3>Order placed</h3>
      <p id="confNumber"></p>
      <p id="confDetails"></p>
      <p>We'll text you when it's ready.</p>
      <button class="new-order-btn" id="newOrderBtn">Start a new order</button>
    </div>
  </aside>
</main>

<script>
const MENU = [
  {
    category: "Coffee",
    items: [
      { id:"c1", name:"Drip Coffee", desc:"House blend, brewed fresh all day.", price:3.25, icon:"mug" },
      { id:"c2", name:"Cappuccino", desc:"Double espresso, steamed milk, deep foam.", price:4.50, icon:"cappuccino" },
      { id:"c3", name:"Caffè Latte", desc:"Espresso with steamed milk, light foam.", price:4.75, icon:"latte" },
      { id:"c4", name:"Cold Brew", desc:"Steeped 18 hours, served over ice.", price:4.25, icon:"coldbrew" },
      { id:"c5", name:"Espresso Shot", desc:"Single or double, straight up.", price:2.75, icon:"espresso" }
    ]
  },
  {
    category: "Tea & Other Drinks",
    items: [
      { id:"t1", name:"Matcha Latte", desc:"Ceremonial-grade matcha, steamed milk.", price:4.95, icon:"matcha" },
      { id:"t2", name:"Chai Latte", desc:"House-spiced chai concentrate, steamed milk.", price:4.50, icon:"chai" },
      { id:"t3", name:"Loose Leaf Tea", desc:"Ask about today's selection.", price:3.50, icon:"tea" }
    ]
  },
  {
    category: "Pastries",
    items: [
      { id:"p1", name:"Almond Croissant", desc:"Laminated dough, almond cream filling.", price:4.25, icon:"croissant" },
      { id:"p2", name:"Cinnamon Roll", desc:"Baked in-house, cream cheese glaze.", price:4.75, icon:"cinnamonroll" },
      { id:"p3", name:"Blueberry Muffin", desc:"Made with wild blueberries.", price:3.75, icon:"muffin" },
      { id:"p4", name:"Plain Bagel & Cream Cheese", desc:"Toasted, whipped cream cheese.", price:3.50, icon:"bagel" }
    ]
  },
  {
    category: "Light Bites",
    items: [
      { id:"l1", name:"Avocado Toast", desc:"Sourdough, smashed avocado, chili flake.", price:8.50, icon:"avocadotoast" },
      { id:"l2", name:"Breakfast Sandwich", desc:"Egg, cheddar, choice of bacon on brioche.", price:7.95, icon:"sandwich" },
      { id:"l3", name:"Overnight Oats", desc:"Oats, chia, seasonal fruit, honey.", price:6.50, icon:"oats" }
    ]
  }
];

const ICONS = {
  mug: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><path d="M16 22h20v11a10 6 0 0 1-20 0z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M36 25h4a4 4 0 0 1 0 8h-4" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M20 16c1 2-1 3 0 5M25 16c1 2-1 3 0 5" fill="none" stroke="#8A5A2B" stroke-width="1.6" stroke-linecap="round"/>`,
  cappuccino: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><ellipse cx="28" cy="42" rx="15" ry="2.5" fill="none" stroke="#8A5A2B" stroke-width="1.6"/><path d="M17 21h18v9a9 9 0 0 1-18 0z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M35 24h3a3.5 3.5 0 0 1 0 7h-3" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M20 21c2-3 6-3 8 0s6 3 8 0" fill="none" stroke="#8A5A2B" stroke-width="1.6"/>`,
  latte: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><path d="M20 16h16l-1.5 24a3 3 0 0 1-3 2.8h-7a3 3 0 0 1-3-2.8z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M24 21c1.5 1.5 1.5 3 0 4.5s-1.5 3 0 4.5" fill="none" stroke="#8A5A2B" stroke-width="1.4" stroke-linecap="round"/>`,
  coldbrew: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><path d="M20 14h16l-2 28a2 2 0 0 1-2 1.8h-8a2 2 0 0 1-2-1.8z" fill="none" stroke="#8A5A2B" stroke-width="2"/><line x1="20.7" y1="22" x2="35.3" y2="22" stroke="#8A5A2B" stroke-width="1.4"/><line x1="34" y1="10" x2="30" y2="24" stroke="#8A5A2B" stroke-width="1.6" stroke-linecap="round"/>`,
  espresso: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><path d="M18 25h16v6a8 5 0 0 1-16 0z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M34 27h3a3 3 0 0 1 0 6h-3" fill="none" stroke="#8A5A2B" stroke-width="2"/><line x1="16" y1="35" x2="36" y2="35" stroke="#8A5A2B" stroke-width="2"/><path d="M22 20c1 1.4-1 2-0.5 3.4" fill="none" stroke="#8A5A2B" stroke-width="1.4" stroke-linecap="round"/>`,
  matcha: `<circle cx="28" cy="28" r="28" fill="#E7EEDD"/><path d="M16 24h24v6a12 8 0 0 1-24 0z" fill="none" stroke="#4C6B4A" stroke-width="2"/><line x1="28" y1="12" x2="28" y2="24" stroke="#4C6B4A" stroke-width="1.6"/><line x1="24" y1="14" x2="24" y2="24" stroke="#4C6B4A" stroke-width="1.2"/><line x1="32" y1="14" x2="32" y2="24" stroke="#4C6B4A" stroke-width="1.2"/>`,
  chai: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><path d="M17 22h18v10a9 8 0 0 1-18 0z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M35 25h3a3 3 0 0 1 0 6h-3" fill="none" stroke="#8A5A2B" stroke-width="2"/><circle cx="23" cy="17" r="1.4" fill="#8A5A2B"/><circle cx="28" cy="15" r="1.4" fill="#8A5A2B"/><circle cx="32" cy="18" r="1.4" fill="#8A5A2B"/>`,
  tea: `<circle cx="28" cy="28" r="28" fill="#E7EEDD"/><path d="M15 26h20v4a10 8 0 0 1-20 0z" fill="none" stroke="#4C6B4A" stroke-width="2"/><path d="M35 27h5l-3 5h-3" fill="none" stroke="#4C6B4A" stroke-width="2" stroke-linejoin="round"/><path d="M15 27l-4-1" fill="none" stroke="#4C6B4A" stroke-width="2" stroke-linecap="round"/><path d="M22 21c1-2-1-3 0-5" fill="none" stroke="#4C6B4A" stroke-width="1.4" stroke-linecap="round"/>`,
  croissant: `<circle cx="28" cy="28" r="28" fill="#F6E4C3"/><path d="M14 32c4-14 24-14 28 0-6-4-10-4-14 0s-8 4-14 0z" fill="none" stroke="#8A5A2B" stroke-width="2" stroke-linejoin="round"/><path d="M20 27c1.5-2 3-2 4 0M28 25c1.5-2 3-2 4 0M24 30c1.5-2 3-2 4 0" fill="none" stroke="#8A5A2B" stroke-width="1.2" stroke-linecap="round"/>`,
  cinnamonroll: `<circle cx="28" cy="28" r="28" fill="#F6E4C3"/><circle cx="28" cy="28" r="12" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M28 20a8 8 0 0 1 8 8 5 5 0 0 1-5 5 3 3 0 0 1-3-3" fill="none" stroke="#8A5A2B" stroke-width="1.6"/>`,
  muffin: `<circle cx="28" cy="28" r="28" fill="#F6E4C3"/><path d="M18 26c0-5 4-8 10-8s10 3 10 8z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M16 26l2 14a2 2 0 0 0 2 1.8h16a2 2 0 0 0 2-1.8l2-14z" fill="none" stroke="#8A5A2B" stroke-width="2"/><line x1="16" y1="26" x2="40" y2="26" stroke="#8A5A2B" stroke-width="1.6"/><circle cx="23" cy="20" r="1.4" fill="#4C6B4A"/><circle cx="28" cy="18" r="1.4" fill="#4C6B4A"/><circle cx="33" cy="20" r="1.4" fill="#4C6B4A"/>`,
  bagel: `<circle cx="28" cy="28" r="28" fill="#F6E4C3"/><circle cx="28" cy="28" r="13" fill="none" stroke="#8A5A2B" stroke-width="2"/><circle cx="28" cy="28" r="5" fill="none" stroke="#8A5A2B" stroke-width="2"/><circle cx="22" cy="22" r="1" fill="#8A5A2B"/><circle cx="34" cy="24" r="1" fill="#8A5A2B"/><circle cx="30" cy="35" r="1" fill="#8A5A2B"/>`,
  avocadotoast: `<circle cx="28" cy="28" r="28" fill="#F6E4C3"/><rect x="14" y="30" width="28" height="9" rx="1.5" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M14 30c2-10 8-14 14-14s12 4 14 14z" fill="none" stroke="#8A5A2B" stroke-width="2"/><ellipse cx="28" cy="24" rx="8" ry="5" fill="none" stroke="#4C6B4A" stroke-width="2"/><circle cx="28" cy="24" r="2" fill="#4C6B4A"/>`,
  sandwich: `<circle cx="28" cy="28" r="28" fill="#F6E4C3"/><path d="M14 38l14-22 14 22z" fill="none" stroke="#8A5A2B" stroke-width="2" stroke-linejoin="round"/><line x1="17.5" y1="32" x2="38.5" y2="32" stroke="#8A5A2B" stroke-width="1.6"/><line x1="20.5" y1="27" x2="35.5" y2="27" stroke="#8A5A2B" stroke-width="1.4"/>`,
  oats: `<circle cx="28" cy="28" r="28" fill="#F1E4CE"/><path d="M15 26h26v3a13 10 0 0 1-26 0z" fill="none" stroke="#8A5A2B" stroke-width="2"/><path d="M18 26c2-2 4 0 6-2s4 0 6-2 4 0 6-2" fill="none" stroke="#8A5A2B" stroke-width="1.4"/><circle cx="24" cy="32" r="1.3" fill="#B4453A"/><circle cx="31" cy="33" r="1.3" fill="#B4453A"/>`
};

function iconSVG(type){
  const inner = ICONS[type] || ICONS.mug;
  return `<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

let cart = {}; // id -> { item, qty }
let orderCounter = 100;

const menuEl = document.getElementById('menu');
const cartLinesEl = document.getElementById('cartLines');
const emptyNoteEl = document.getElementById('emptyNote');
const totalsBlockEl = document.getElementById('totalsBlock');
const orderFormEl = document.getElementById('orderForm');
const confirmationEl = document.getElementById('confirmation');
const toggleCountEl = document.getElementById('toggleCount');
const cartPanel = document.getElementById('cartPanel');
const backdrop = document.getElementById('backdrop');

function money(n){ return '$' + n.toFixed(2); }

function renderMenu(){
  menuEl.innerHTML = '';
  MENU.forEach(section => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `<h2>${section.category}</h2>`;
    section.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <div class="item-main">
          <div class="item-image">${iconSVG(item.icon)}</div>
          <div class="item-info">
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="item-price">${money(item.price)}</div>
          </div>
        </div>
        <div class="item-right" id="right-${item.id}"></div>
      `;
      catDiv.appendChild(row);
      renderItemControl(item);
    });
    menuEl.appendChild(catDiv);
  });
  // second pass since right-slots were just created
  MENU.forEach(section => section.items.forEach(renderItemControl));
}

function renderItemControl(item){
  const slot = document.getElementById(`right-${item.id}`);
  if(!slot) return;
  const line = cart[item.id];
  if(!line){
    slot.innerHTML = `<button class="add-btn" data-add="${item.id}">Add</button>`;
  } else {
    slot.innerHTML = `
      <div class="qty-controls">
        <button data-dec="${item.id}" aria-label="Decrease quantity">–</button>
        <span>${line.qty}</span>
        <button data-inc="${item.id}" aria-label="Increase quantity">+</button>
      </div>
    `;
  }
}

function findItem(id){
  for(const section of MENU){
    const found = section.items.find(i => i.id === id);
    if(found) return found;
  }
}

function addItem(id){
  const item = findItem(id);
  if(!cart[id]) cart[id] = { item, qty: 0 };
  cart[id].qty += 1;
  onCartChange();
}

function decItem(id){
  if(!cart[id]) return;
  cart[id].qty -= 1;
  if(cart[id].qty <= 0) delete cart[id];
  onCartChange();
}

function removeItem(id){
  delete cart[id];
  onCartChange();
}

function onCartChange(){
  renderCart();
  MENU.forEach(section => section.items.forEach(renderItemControl));
}

function renderCart(){
  const ids = Object.keys(cart);
  const totalQty = ids.reduce((sum,id) => sum + cart[id].qty, 0);
  toggleCountEl.textContent = totalQty;

  cartLinesEl.innerHTML = '';
  if(ids.length === 0){
    emptyNoteEl.style.display = 'block';
    totalsBlockEl.style.display = 'none';
    orderFormEl.style.display = 'none';
    return;
  }
  emptyNoteEl.style.display = 'none';
  totalsBlockEl.style.display = 'block';
  orderFormEl.style.display = 'block';

  let subtotal = 0;
  ids.forEach(id => {
    const { item, qty } = cart[id];
    const lineTotal = item.price * qty;
    subtotal += lineTotal;
    const row = document.createElement('div');
    row.className = 'cart-line';
    row.innerHTML = `
      <div>
        <div class="name">${item.name}</div>
        <div class="meta">${qty} × ${money(item.price)}</div>
      </div>
      <div style="text-align:right;">
        <div>${money(lineTotal)}</div>
        <button class="remove-link" data-remove="${id}">remove</button>
      </div>
    `;
    cartLinesEl.appendChild(row);
  });

  const tax = subtotal * 0.08;
  const total = subtotal + tax;
  document.getElementById('subtotalVal').textContent = money(subtotal);
  document.getElementById('taxVal').textContent = money(tax);
  document.getElementById('totalVal').textContent = money(total);
}

menuEl.addEventListener('click', e => {
  if(e.target.dataset.add) addItem(e.target.dataset.add);
  if(e.target.dataset.inc) addItem(e.target.dataset.inc);
  if(e.target.dataset.dec) decItem(e.target.dataset.dec);
});

cartLinesEl.addEventListener('click', e => {
  if(e.target.dataset.remove) removeItem(e.target.dataset.remove);
});

document.getElementById('orderForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const errEl = document.getElementById('formError');

  if(!name || !phone){
    errEl.textContent = 'Please enter your name and phone number.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const orderType = document.querySelector('input[name="orderType"]:checked').value;
  const notes = document.getElementById('notes').value.trim();
  orderCounter += 1;

  const itemSummary = Object.values(cart).map(l => `${l.qty}× ${l.item.name}`).join(', ');

  document.getElementById('confNumber').textContent = `Order #${orderCounter} — ${orderType} for ${name}`;
  document.getElementById('confDetails').textContent = itemSummary + (notes ? ` (Note: ${notes})` : '');

  orderFormEl.style.display = 'none';
  totalsBlockEl.style.display = 'none';
  cartLinesEl.style.display = 'none';
  document.querySelector('#cartPanel h2').style.display = 'none';
  confirmationEl.style.display = 'block';
});

document.getElementById('newOrderBtn').addEventListener('click', () => {
  cart = {};
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('notes').value = '';
  confirmationEl.style.display = 'none';
  cartLinesEl.style.display = 'block';
  document.querySelector('#cartPanel h2').style.display = 'block';
  onCartChange();
  closeCartOnMobile();
});

// Mobile cart toggle
const cartToggleBtn = document.getElementById('cartToggleBtn');
cartToggleBtn.addEventListener('click', () => {
  cartPanel.classList.add('open');
  backdrop.classList.add('show');
});
backdrop.addEventListener('click', closeCartOnMobile);
function closeCartOnMobile(){
  cartPanel.classList.remove('open');
  backdrop.classList.remove('show');
}

renderMenu();
renderCart();
</script>

</body>
</html>
