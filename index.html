<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cup of Cafe — Order Online</title>
<style>
  :root{
    --bg: #FFFFFF;
    --panel-bg: #FAF6EF;
    --ink: #2B2018;
    --sub: #7A6A57;
    --line: #E7DFD0;
    --panel: #FFFFFF;
    --brown: #5C3A21;
    --brown-dark: #3E2513;
    --tan: #E9DCC3;
    --danger: #B4453A;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:24px 5vw 18px;
    border-bottom:1px solid var(--line);
  }
  header .brand h1{
    font-size:1.55rem;
    margin:0;
    letter-spacing:0.5px;
    font-weight:800;
    text-transform:uppercase;
  }
  header .brand p{
    margin:3px 0 0;
    color:var(--sub);
    font-size:0.85rem;
  }
  header .mode{
    font-size:0.85rem;
    color:var(--sub);
    padding-top:4px;
  }
  .cart-toggle{
    background:var(--brown-dark);
    color:#fff;
    border:none;
    padding:9px 15px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:0.85rem;
  }
  .cart-toggle:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--brown);
    outline-offset:2px;
  }

  .tabs{
    display:flex;
    gap:10px;
    padding:18px 5vw 14px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px 16px;
    border-radius:var(--radius);
    font-size:0.85rem;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--brown-dark);
    border-color:var(--brown-dark);
    color:#fff;
  }

  main{
    display:grid;
    grid-template-columns: 1fr 340px;
    gap:0;
    max-width:1300px;
    margin:0 auto;
  }
  .menu{ padding: 10px 5vw 60px 5vw; }
  .category{ margin-top:34px; }
  .category-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .category-head h2{
    font-size:1rem;
    letter-spacing:0.6px;
    text-transform:uppercase;
    font-weight:800;
    margin:0;
    color:var(--ink);
  }
  .category-head span{
    font-size:0.82rem;
    color:var(--sub);
  }

  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap:22px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card-image{
    width:100%;
    height:160px;
    display:block;
  }
  .card-image svg{ width:100%; height:100%; display:block; }
  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .card-title-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .card-title-row h3{ margin:0; font-size:1rem; font-weight:700; color:var(--ink); font-family:'Georgia', serif; }
  .card-price{
    font-size:0.92rem;
    color:var(--ink);
    white-space:nowrap;
    font-weight:700;
  }
  .card-desc{
    margin:6px 0 0;
    color:var(--sub);
    font-size:0.83rem;
    line-height:1.45;
    flex:1;
  }
  .card-actions{ margin-top:12px; display:flex; gap:8px; }
  .add-btn{
    flex:1;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:0.82rem;
  }
  .add-btn:hover{ background:var(--panel-bg); }
  .buy-btn{
    flex:1;
    background:var(--brown-dark);
    border:1px solid var(--brown-dark);
    color:#fff;
    padding:8px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:0.82rem;
  }
  .buy-btn:hover{ background:var(--brown); }
  .qty-controls{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--panel-bg);
    border-radius:5px;
    padding:4px 8px;
  }
  .qty-controls button{
    width:26px; height:26px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:50%;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
  }
  .qty-controls span{ font-weight:700; }

  /* Cart panel */
  aside.cart{
    background:var(--panel-bg);
    border-left:1px solid var(--line);
    padding:26px 24px 40px;
    position:sticky;
    top:0;
    align-self:start;
    height:100vh;
    overflow-y:auto;
  }
  .cart-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .cart-head h2{
    font-size:0.95rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-weight:800;
    margin:0;
    color:var(--ink);
  }
  .cart-count{
    background:#fff;
    border:1px solid var(--line);
    border-radius:50%;
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    font-size:0.82rem;
    font-weight:700;
  }
  .cart-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:0.88rem;
  }
  .cart-line .name{ font-weight:700; }
  .cart-line .meta{ color:var(--sub); font-size:0.78rem; }
  .remove-link{
    background:none;border:none;color:var(--danger);
    font-size:0.76rem; cursor:pointer; padding:0; text-decoration:underline;
  }
  .empty-note{ color:var(--sub); font-size:0.87rem; margin-top:40px; text-align:center; line-height:1.6; }
  .totals{
    margin-top:18px;
    font-size:0.88rem;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .totals-row{ display:flex; justify-content:space-between; padding:5px 0; }
  .totals-row.grand{ font-weight:800; font-size:1.05rem; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }

  fieldset{ border:none; padding:0; margin:18px 0 0; }
  label{ display:block; font-size:0.72rem; letter-spacing:0.4px; text-transform:uppercase; color:var(--sub); margin:12px 0 4px; }
  input[type=text], input[type=tel], textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    font-size:0.88rem;
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:#fff;
  }
  textarea{ resize:vertical; min-height:52px; }
  .radio-group{ display:flex; gap:14px; font-size:0.85rem; }
  .radio-group label{ display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); text-transform:none; }

  .place-order{
    width:100%;
    margin-top:16px;
    padding:12px;
    background:var(--brown-dark);
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:0.9rem;
    cursor:pointer;
  }
  .place-order:disabled{ background:#D8CDB8; color:#8a8070; cursor:not-allowed; }
  .error{ color:var(--danger); font-size:0.78rem; margin-top:6px; }

  .confirmation{
    text-align:center;
    padding:30px 10px;
  }
  .confirmation .stamp{ font-size:2rem; margin-bottom:6px; }
  .confirmation h3{ margin:0 0 6px; font-family:'Georgia', serif; }
  .confirmation p{ color:var(--sub); font-size:0.87rem; margin:4px 0; }
  .new-order-btn{
    margin-top:16px;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:9px 18px;
    border-radius:5px;
    cursor:pointer;
  }

  @media (max-width: 860px){
    main{ grid-template-columns: 1fr; }
    aside.cart{
      position:fixed;
      top:0; right:0;
      width:min(90vw, 380px);
      height:100vh;
      transform:translateX(100%);
      transition:transform 0.25s ease;
      box-shadow:-6px 0 24px rgba(0,0,0,0.15);
      z-index:20;
    }
    aside.cart.open{ transform:translateX(0); }
    .cart-toggle{ display:inline-block; }
    .backdrop{
      display:none;
      position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:15;
    }
    .backdrop.show{ display:block; }
  }
  @media (min-width: 861px){
    .cart-toggle{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Cup of Cafe</h1>
    <p>Neighborhood Coffee & Pastry Counter</p>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="mode">Counter Pickup Ordering</span>
    <button class="cart-toggle" id="cartToggleBtn">Cart (<span id="toggleCount">0</span>)</button>
  </div>
</header>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="all">All Items</button>
  <button class="tab-btn" data-tab="coffee">Coffee</button>
  <button class="tab-btn" data-tab="pastries">Pastries & Breads</button>
  <button class="tab-btn" data-tab="hot">Hot Brews</button>
  <button class="tab-btn" data-tab="iced">Iced & Cold</button>
  <button class="tab-btn" data-tab="bites">Light Bites</button>
</div>

<main>
  <section class="menu" id="menu"></section>

  <div class="backdrop" id="backdrop"></div>
  <aside class="cart" id="cartPanel">
    <div class="cart-head">
      <h2>Your Order</h2>
      <div class="cart-count" id="toggleCount2">0</div>
    </div>
    <div id="cartLines"></div>
    <div id="emptyNote" class="empty-note">Your tray is empty.<br>Choose an item to start.</div>

    <div class="totals" id="totalsBlock" style="display:none;">
      <div class="totals-row"><span>Subtotal</span><span id="subtotalVal">₱0.00</span></div>
      <div class="totals-row"><span>Tax (5%)</span><span id="taxVal">₱0.00</span></div>
      <div class="totals-row grand"><span>Total Amount</span><span id="totalVal">₱0.00</span></div>
    </div>

    <form id="orderForm">
      <fieldset>
        <label for="custName">Customer Name (for callout)</label>
        <input type="text" id="custName" placeholder="Guest Customer">

        <label for="custPhone">Phone Number</label>
        <input type="tel" id="custPhone" placeholder="For pickup text alert">

        <label>Order Type</label>
        <div class="radio-group">
          <label><input type="radio" name="orderType" value="Pickup" checked> Pickup</label>
          <label><input type="radio" name="orderType" value="Dine-in"> Dine-in</label>
        </div>

        <label for="notes">Notes (optional)</label>
        <textarea id="notes" placeholder="Oat milk, extra hot, allergies, etc."></textarea>
      </fieldset>
      <div id="formError" class="error" style="display:none;"></div>
      <button type="submit" class="place-order" id="placeOrderBtn" disabled>Place Order</button>
    </form>

    <div class="confirmation" id="confirmation" style="display:none;">
      <div class="stamp">☕</div>
      <h3>Order placed</h3>
      <p id="confNumber"></p>
      <p id="confDetails"></p>
      <p>We'll text you when it's ready.</p>
      <button class="new-order-btn" id="newOrderBtn">Start a new order</button>
    </div>
  </aside>
</main>

function iconSVG(type){
  const inner = ICONS[type] || ICONS.mug;
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

let cart = {};
let orderCounter = 100;
let activeTab = 'all';

const menuEl = document.getElementById('menu');
const cartLinesEl = document.getElementById('cartLines');
const emptyNoteEl = document.getElementById('emptyNote');
const totalsBlockEl = document.getElementById('totalsBlock');
const orderFormEl = document.getElementById('orderForm');
const confirmationEl = document.getElementById('confirmation');
const toggleCountEl = document.getElementById('toggleCount');
const toggleCount2El = document.getElementById('toggleCount2');
const cartPanel = document.getElementById('cartPanel');
const backdrop = document.getElementById('backdrop');
const placeOrderBtn = document.getElementById('placeOrderBtn');

function money(n){ return '₱' + n.toFixed(2); }

function itemVisible(item){
  if(activeTab === 'all') return true;
  return item.tags.includes(activeTab);
}

function renderMenu(){
  menuEl.innerHTML = '';
  MENU.forEach(section => {
    const visibleItems = section.items.filter(itemVisible);
    if(visibleItems.length === 0) return;
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `
      <div class="category-head">
        <h2>${section.category}</h2>
        <span>${section.subtitle}</span>
      </div>
      <div class="card-grid" id="grid-${section.key}"></div>
    `;
    menuEl.appendChild(catDiv);
    const grid = catDiv.querySelector('.card-grid');
    visibleItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-image">${iconSVG(item.icon)}</div>
        <div class="card-body">
          <div class="card-title-row">
            <h3>${item.name}</h3>
            <span class="card-price">${money(item.price)}</span>
          </div>
          <p class="card-desc">${item.desc}</p>
          <div class="card-actions" id="right-${item.id}"></div>
        </div>
      `;
      grid.appendChild(card);
    });
  });
  MENU.forEach(section => section.items.forEach(renderItemControl));
}

function renderItemControl(item){
  const slot = document.getElementById(`right-${item.id}`);
  if(!slot) return;
  const line = cart[item.id];
  if(!line){
    slot.innerHTML = `
      <button class="add-btn" data-add="${item.id}">Add to Cart</button>
      <button class="buy-btn" data-buy="${item.id}">Buy Now</button>
    `;
  } else {
    slot.innerHTML = `
      <div class="qty-controls">
        <button data-dec="${item.id}" aria-label="Decrease quantity">–</button>
        <span>${line.qty}</span>
        <button data-inc="${item.id}" aria-label="Increase quantity">+</button>
      </div>
    `;
  }
}

function findItem(id){
  for(const section of MENU){
    const found = section.items.find(i => i.id === id);
    if(found) return found;
  }
}

function addItem(id){
  const item = findItem(id);
  if(!cart[id]) cart[id] = { item, qty: 0 };
  cart[id].qty += 1;
  onCartChange();
}

function decItem(id){
  if(!cart[id]) return;
  cart[id].qty -= 1;
  if(cart[id].qty <= 0) delete cart[id];
  onCartChange();
}

function removeItem(id){
  delete cart[id];
  onCartChange();
}

function onCartChange(){
  renderCart();
  MENU.forEach(section => section.items.forEach(renderItemControl));
}

function openCartMobile(){
  cartPanel.classList.add('open');
  backdrop.classList.add('show');
}

function renderCart(){
  const ids = Object.keys(cart);
  const totalQty = ids.reduce((sum,id) => sum + cart[id].qty, 0);
  toggleCountEl.textContent = totalQty;
  toggleCount2El.textContent = totalQty;

  cartLinesEl.innerHTML = '';
  if(ids.length === 0){
    emptyNoteEl.style.display = 'block';
    totalsBlockEl.style.display = 'none';
    placeOrderBtn.disabled = true;
    return;
  }
  emptyNoteEl.style.display = 'none';
  totalsBlockEl.style.display = 'block';
  placeOrderBtn.disabled = false;

  let subtotal = 0;
  ids.forEach(id => {
    const { item, qty } = cart[id];
    const lineTotal = item.price * qty;
    subtotal += lineTotal;
    const row = document.createElement('div');
    row.className = 'cart-line';
    row.innerHTML = `
      <div>
        <div class="name">${item.name}</div>
        <div class="meta">${qty} × ${money(item.price)}</div>
      </div>
      <div style="text-align:right;">
        <div>${money(lineTotal)}</div>
        <button class="remove-link" data-remove="${id}">remove</button>
      </div>
    `;
    cartLinesEl.appendChild(row);
  });

  const tax = subtotal * 0.05;
  const total = subtotal + tax;
  document.getElementById('subtotalVal').textContent = money(subtotal);
  document.getElementById('taxVal').textContent = money(tax);
  document.getElementById('totalVal').textContent = money(total);
}

document.getElementById('tabs').addEventListener('click', e => {
  if(!e.target.dataset.tab) return;
  activeTab = e.target.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  renderMenu();
});

menuEl.addEventListener('click', e => {
  if(e.target.dataset.add) addItem(e.target.dataset.add);
  if(e.target.dataset.buy){ addItem(e.target.dataset.buy); openCartMobile(); }
  if(e.target.dataset.inc) addItem(e.target.dataset.inc);
  if(e.target.dataset.dec) decItem(e.target.dataset.dec);
});

cartLinesEl.addEventListener('click', e => {
  if(e.target.dataset.remove) removeItem(e.target.dataset.remove);
});

document.getElementById('orderForm').addEventListener('submit', e => {
  e.preventDefault();
  if(Object.keys(cart).length === 0) return;
  const name = document.getElementById('custName').value.trim() || 'Guest Customer';
  const phone = document.getElementById('custPhone').value.trim();
  const errEl = document.getElementById('formError');

  if(!phone){
    errEl.textContent = 'Please enter a phone number for pickup alerts.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const orderType = document.querySelector('input[name="orderType"]:checked').value;
  const notes = document.getElementById('notes').value.trim();
  orderCounter += 1;

  const itemSummary = Object.values(cart).map(l => `${l.qty}× ${l.item.name}`).join(', ');

  document.getElementById('confNumber').textContent = `Order #${orderCounter} — ${orderType} for ${name}`;
  document.getElementById('confDetails').textContent = itemSummary + (notes ? ` (Note: ${notes})` : '');

  orderFormEl.style.display = 'none';
  totalsBlockEl.style.display = 'none';
  cartLinesEl.style.display = 'none';
  document.querySelector('.cart-head').style.display = 'none';
  confirmationEl.style.display = 'block';
});

document.getElementById('newOrderBtn').addEventListener('click', () => {
  cart = {};
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('notes').value = '';
  confirmationEl.style.display = 'none';
  orderFormEl.style.display = 'block';
  cartLinesEl.style.display = 'block';
  document.querySelector('.cart-head').style.display = 'flex';
  onCartChange();
  closeCartOnMobile();
});

const cartToggleBtn = document.getElementById('cartToggleBtn');
cartToggleBtn.addEventListener('click', openCartMobile);
backdrop.addEventListener('click', closeCartOnMobile);
function closeCartOnMobile(){
  cartPanel.classList.remove('open');
  backdrop.classList.remove('show');
}

renderMenu();
renderCart();
</script>

</body>
</html>
